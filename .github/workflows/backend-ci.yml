name: Backend CI

on:
  push:
    branches:
      - develop
    paths:
      - "system-barber-back/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - develop
      - main
    paths:
      - "system-barber-back/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: system-barber-back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: system-barber-back/yarn.lock

      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn test --run

      - run: yarn build