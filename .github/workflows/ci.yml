name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./system-barber-back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            system-barber-back/yarn.lock
            system-barber-front/yarn.lock

      - name: Enable corepack
        run: corepack enable

      - name: Install backend dependencies
        run: yarn install --frozen-lockfile

      - name: Lint backend
        run: yarn lint

      - name: Test backend
        run: yarn test --run

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./system-barber-front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            system-barber-back/yarn.lock
            system-barber-front/yarn.lock

      - name: Enable corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Lint frontend
        run: yarn lint

      - name: Build frontend
        run: yarn build
