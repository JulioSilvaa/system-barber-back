services:
  postgres:
    image: postgres:16-alpine
    container_name: system-barber-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: system-barber-backend
    environment:
      PORT: 3333
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      BCRYPT_SALT: ${BCRYPT_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ASAAS_API_URL: ${ASAAS_API_URL}
      ASAAS_API_KEY: ${ASAAS_API_KEY}
      ASAAS_WEBHOOK_SECRET: ${ASAAS_WEBHOOK_SECRET}
      PLAN_PRICE_BASIC: ${PLAN_PRICE_BASIC:-99.90}
      PLAN_PRICE_PRO: ${PLAN_PRICE_PRO:-199.90}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@systembarber.com}
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3333:3333'
    volumes:
      - uploads_data:/app/uploads
    command: ['sh', '-c', 'npx prisma migrate deploy && node dist/server.js']

  frontend:
    build:
      context: ../system-barber-front
      dockerfile: Dockerfile
    container_name: system-barber-frontend
    depends_on:
      - backend
    ports:
      - '3001:80'

volumes:
  postgres_data:
  uploads_data:
